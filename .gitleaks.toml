title = "Precis Web Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Allow documented placeholders and generated dependency metadata"
paths = [
  '''package-lock\.json''',
  '''react-app/package-lock\.json''',
]
regexes = [
  '''USER:PASSWORD@HOST''',
  '''USER:PASSWORD@UNPOOLED_HOST''',
  '''your-project\.vercel\.app''',
  '''images\.example\.com''',
  '''cdn\.example\.com''',
]