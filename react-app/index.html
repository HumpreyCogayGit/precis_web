<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- The loading animation is plain CSS/JS so it does not wait on the app
         bundle. public/loader/ holds three interchangeable scenes; pick.js
         chooses one at random per visit and writes its stylesheet and script
         in right here. See pick.js to pin one or to add another.

         Keep this above every stylesheet, including the one the build adds to
         the end of the head: a script cannot run while a stylesheet before it
         is still loading, and the app's pulls in web fonts from another host.
         Down in the body, the scene was not even requested until those fonts
         had answered. -->
    <script src="/loader/pick.js"></script>
    <!-- Replaced per route at build time by scripts/render-pages.js (lib/pageMeta.js);
         these are the home page values, kept so a plain Vite build is still complete. -->
    <!-- precis:meta -->
    <title>Precis Daily Tech Brief: AI and cybersecurity news</title>
    <meta name="description" content="Today&#39;s AI and cybersecurity news from about 120 sources, ranked, tagged and summarised in one daily edition. Every story links to the original." />
    <link rel="canonical" href="https://precisnews.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Precis" />
    <meta property="og:title" content="Precis Daily Tech Brief: AI and cybersecurity news" />
    <meta property="og:description" content="Today&#39;s AI and cybersecurity news from about 120 sources, ranked, tagged and summarised in one daily edition. Every story links to the original." />
    <meta property="og:url" content="https://precisnews.vercel.app/" />
    <meta property="og:image" content="https://precisnews.vercel.app/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Precis Daily Tech Brief: AI and cybersecurity news" />
    <meta name="twitter:description" content="Today&#39;s AI and cybersecurity news from about 120 sources, ranked, tagged and summarised in one daily edition. Every story links to the original." />
    <meta name="twitter:image" content="https://precisnews.vercel.app/og-default.png" />
    <!-- /precis:meta -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="precis-loader"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
