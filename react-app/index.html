<!DOCTYPE html>
<html lang="en">

    <title>Precis Daily Tech Brief: AI and cybersecurity news</title>

    <link rel="canonical" href="https://precisnews.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Precis" />
    <meta property="og:title" content="Precis Daily Tech Brief: AI and cybersecurity news" />
    <meta property="og:description" content="Today&#39;s AI and cybersecurity news from about 120 sources, ranked, tagged and summarised in one daily edition. Every story links to the original." />
    <meta property="og:url" content="https://precisnews.vercel.app/" />

    <!-- /precis:meta -->
    <!-- The loading animation is plain CSS/JS so it paints before the app
         bundle has parsed; see public/loader/ for the standalone preview. -->
    <link rel="stylesheet" href="/loader/loader.css" />

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
